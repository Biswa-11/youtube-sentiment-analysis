<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Sentiment Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo-wrap">
            <span class="logo-icon">▶</span>
            <span class="logo-text">YT Sentiment</span>
        </div>
        <div class="menu-wrap">
            <button class="menu-trigger" id="menuTrigger" type="button" aria-label="Open menu" aria-expanded="false">⋮</button>
            <div class="menu-dropdown hidden" id="menuDropdown">
                <button type="button" class="menu-item" data-theme="system">System</button>
                <button type="button" class="menu-item" data-theme="light">Light</button>
                <button type="button" class="menu-item" data-theme="dark">Dark</button>
                <button type="button" class="menu-item" id="printBtn">Print</button>
            </div>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-wrap">
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">Built by Biswajit Mohapatra @2026</footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
